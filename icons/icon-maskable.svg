<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Movie Vault (maskable, full-bleed)</title>
  <!-- Same artwork as icon.svg, but full-bleed (the OS applies its own mask) with the disc scaled to 90% so it stays inside the maskable safe zone. Source for icon-maskable-512.png and apple-touch-icon.png. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="51.5" y1="-36.1" x2="460.5" y2="548.1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(.9) translate(-256 -256)">
    <circle cx="256" cy="256" r="154.5" fill="none" stroke="#070914" stroke-opacity=".45" stroke-width="26.5"/>
    <rect x="114.8" y="229.5" width="282.4" height="53" rx="26.5" fill="#070914" fill-opacity=".56"/>
  </g>
</svg>
